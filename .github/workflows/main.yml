name: CVE-2026-43499
#permissions: write-all
env:
  GITHUB_TOKEN: ${{ secrets.PAT_NO_EXPIRE }}
concurrency:
      group: staging_environment
      cancel-in-progress: true

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout code
        uses: actions/checkout@master
        with:
          fetch-depth: 0 # fetch full history
          
      - name: make CVE-2026-43499
        if: true
        run: |
          #set -ex
          #repo="${{ github.repository_owner }}/${{ github.event.repository.name }}"
          #echo ${{ vars.CLANG_OFFICIAL }}
          #echo "\$\{\{ github.workspace \}\} : ${{ github.workspace }}"
          #echo "\$\{\{ env.GITHUB_WORKSPACE \}\} : ${{ env.GITHUB_WORKSPACE }}"
          #echo "\$\{GITHUB_WORKSPACE\} : ${GITHUB_WORKSPACE}"
          cd ${GITHUB_WORKSPACE}/IonStack/CVE-2026-43499/exploit
          make

      - name: Upload the build-CVE-2026-43499 dir
        uses: actions/upload-artifact@main
        with:
          name: build-CVE-2026-43499
          path: IonStack/CVE-2026-43499/exploit/build
          include-hidden-files: true
          
          


          
